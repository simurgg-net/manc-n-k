h1,h2,.zname,.logo,.title,.lvl,.val,.nm{font-family:"Lilita One",Nunito,system-ui,sans-serif;font-weight:400;letter-spacing:.01em}

/* buttons: chunky, game-like */
button{font:inherit;font-weight:800;color:#fff7e6;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;
  background:linear-gradient(#8a5c37,#5d3a1e);box-shadow:0 4px 0 var(--wood3),inset 0 1px 0 rgba(255,255,255,.28);text-shadow:0 1px 0 rgba(0,0,0,.45);transition:transform .06s}
button:hover{filter:brightness(1.08)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood3),inset 0 1px 0 rgba(255,255,255,.2)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #fff;outline-offset:2px}
button.primary{background:linear-gradient(#63c03c,var(--green2));box-shadow:0 4px 0 #1a4a0b,inset 0 1px 0 rgba(255,255,255,.35)}
button.small{padding:5px 10px;font-size:13px;border-radius:8px;box-shadow:0 3px 0 var(--wood3),inset 0 1px 0 rgba(255,255,255,.25)}
button[data-a="reveal"][data-d="door"]{background:linear-gradient(#ee6a47,var(--red2));box-shadow:0 4px 0 #5e1a0b,inset 0 1px 0 rgba(255,255,255,.35)}
button[data-a="reveal"][data-d="treasure"]{background:linear-gradient(#ffc03d,var(--orange2));box-shadow:0 4px 0 #6b4005,inset 0 1px 0 rgba(255,255,255,.4)}
button[data-a="draw"]{background:linear-gradient(#4a9bea,var(--blue2));box-shadow:0 4px 0 #0f3a6b,inset 0 1px 0 rgba(255,255,255,.35)}
button[data-a="roll"]{background:linear-gradient(#a56fd0,var(--purple2));box-shadow:0 4px 0 #34194f,inset 0 1px 0 rgba(255,255,255,.35)}
input,select,textarea{font:inherit;font-weight:700;color:var(--ink);background:#fff6dc;border:2px solid var(--edge);border-radius:10px;padding:9px 11px;width:100%;box-shadow:inset 0 2px 4px rgba(90,60,20,.25)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px;font-weight:800}

/* surfaces */
.parch{background:radial-gradient(ellipse at 25% 15%,var(--parch1),var(--parch2) 70%,var(--parch3));border:3px solid var(--edge);
  border-radius:16px 24px 18px 26px / 22px 16px 24px 18px;box-shadow:0 6px 0 rgba(60,35,10,.35),0 14px 24px rgba(0,0,0,.25),inset 0 0 22px rgba(150,100,40,.35)}
.wood{background:repeating-linear-gradient(90deg,rgba(0,0,0,.10) 0 2px,transparent 2px 120px),linear-gradient(#7a5030,var(--wood2));border-bottom:5px solid var(--wood3);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 8px 18px rgba(0,0,0,.35)}
.err{color:#9c1d0a;font-weight:800;margin-top:10px;min-height:18px;text-align:center}

/* lobby */
.lobby{max-width:760px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 16px 40px}
.hero{text-align:center;padding:26px 22px 22px;margin-bottom:18px}
.hero .emblem{font-size:46px;line-height:1;margin-bottom:4px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.hero h1{margin:0;font-size:clamp(40px,9vw,64px);line-height:1;color:var(--gold);-webkit-text-stroke:2px #3b2008;paint-order:stroke fill;text-shadow:0 4px 0 #3b2008,0 8px 10px rgba(0,0,0,.25)}
.hero h2{margin:10px 0 6px;font-size:clamp(18px,4vw,26px);color:var(--ink)}
.hero p{margin:0;color:var(--mute);font-weight:700}
.heroname{padding:14px 18px;margin-bottom:18px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.mode{padding:18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.mode .ico{font-size:40px;line-height:1}
.mode .title{font-size:24px}
.mode small{color:var(--mute);font-size:14px;font-weight:700}
.mode .row{justify-content:center}

/* game shell */
.wrap{max-width:1100px;margin:0 auto;padding:0 12px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 -12px 18px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.top .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.logo{font-size:26px;color:var(--gold);-webkit-text-stroke:1.5px #3b2008;paint-order:stroke fill;text-shadow:0 3px 0 #3b2008}
.pill{background:linear-gradient(var(--parch1),var(--parch2));color:var(--ink);border:2px solid var(--edge);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:800;box-shadow:0 2px 0 rgba(60,35,10,.4)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#d44;margin-right:6px;border:1px solid rgba(0,0,0,.35)}
.dot.on{background:#4ad15f}
.banner{background:linear-gradient(var(--parch1),var(--parch2));border:3px solid var(--orange2);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:800;box-shadow:0 4px 0 rgba(60,35,10,.35)}

/* zones: wooden frame + parchment + ribbon title */
.zone{position:relative;margin:30px 0 14px;padding:26px 14px 12px;border:7px solid var(--wood2);border-radius:16px;
  background:radial-gradient(ellipse at 30% 10%,var(--parch1),var(--parch2) 75%,var(--parch3));
  box-shadow:0 0 0 3px var(--wood-hi),0 8px 0 var(--wood3),0 16px 26px rgba(0,0,0,.35),inset 0 0 26px rgba(150,100,40,.4)}
.zone>.zname,.zone .zhead>.zname{position:absolute;top:-25px;left:50%;transform:translateX(-50%);white-space:nowrap;
  background:linear-gradient(var(--parch1),var(--parch3));border:3px solid var(--edge);border-radius:12px 12px 8px 8px;padding:3px 24px 5px;font-size:21px;color:var(--ink);box-shadow:0 4px 0 rgba(60,35,10,.5)}
.zhead{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;min-height:34px}
.zone.center{background:radial-gradient(ellipse at 50% 0,#3b8157,#1f5236 80%)}.zone.center .empty{color:#d6ecd0}
.stat{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvl{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;font-size:24px;color:#3b2008;
  background:radial-gradient(circle at 35% 30%,#fff1a8,var(--gold) 55%,#d89a0c);border:3px solid #8a5c0a;box-shadow:0 3px 0 #5a3a05,inset 0 -3px 5px rgba(150,90,0,.4)}
.cards{display:flex;gap:10px;flex-wrap:wrap;min-height:90px;align-items:flex-start}
.empty{color:var(--mute);font-size:14px;padding:12px 6px;font-weight:700;font-style:italic}
.sub{color:var(--mute);font-size:13px;margin:10px 0 6px;font-weight:800}

/* cards: door = red leather w/ gold trim, treasure = gold w/ wood trim */
.card{width:122px;min-height:162px;border-radius:12px;padding:9px 8px 8px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:5px;text-align:left;flex:0 0 auto;
  transition:transform .12s;box-shadow:0 5px 0 rgba(40,20,5,.55),0 10px 14px rgba(0,0,0,.28)}
.card:hover{transform:translateY(-5px) rotate(-1deg)}
.card.door{background:radial-gradient(ellipse at 30% 10%,#c4533a,#8e2f1b 70%,#5e1c0f);color:#fff0d8;border:3px solid var(--gold);outline:2px solid #5e1c0f;outline-offset:-7px}
.card.treasure{background:radial-gradient(ellipse at 30% 10%,#ffe27a,#f0b92c 65%,#c88a10);color:#3b2008;border:3px solid #6b4515;outline:2px solid #fff0a8;outline-offset:-7px}
.card .kind{align-self:flex-start;font-size:10.5px;font-weight:800;padding:1px 8px;border-radius:999px;background:rgba(0,0,0,.35);color:#fff3d6}
.card.treasure .kind{background:rgba(70,40,5,.75)}
.card .nm{font-size:16px;line-height:1.1;padding-right:30px}
.card .val{position:absolute;top:5px;right:6px;min-width:30px;height:30px;padding:0 3px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--gold);background:#3b2008;border:2px solid var(--gold)}
.card.treasure .val{color:#fff1a8;border-color:#fff1a8}
.card .tx{font-size:11.5px;line-height:1.25;margin-top:auto;font-weight:700;opacity:.95}
.card.back{background:repeating-linear-gradient(45deg,#4a2d18,#4a2d18 7px,#5d3a1e 7px,#5d3a1e 14px);border:3px solid var(--edge);cursor:default;justify-content:center;align-items:center;font-size:12px;color:#e8cd8f;outline:none;text-align:center}
.card.back:hover{transform:none}
.big .card{width:210px;min-height:270px;padding:14px 12px;cursor:default}
.big .card:hover{transform:none}
.big .card .nm{font-size:24px;padding-right:44px}.big .card .tx{font-size:15px}.big .card .kind{font-size:13px}.big .card .val{min-width:42px;height:42px;font-size:24px}

/* decks & power */
.decks{display:flex;gap:14px;flex-wrap:wrap;align-items:stretch;margin-top:6px}
.deck{display:flex;flex-direction:column;gap:7px;align-items:stretch;min-width:158px;padding:10px 12px;border-radius:14px;background:radial-gradient(ellipse at 30% 10%,var(--parch1),var(--parch2));border:3px solid var(--edge);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.deck .title{font-size:19px}
.deck .count{color:var(--mute);font-size:13px;font-weight:800;margin-top:-4px}
.power{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.power span{background:linear-gradient(var(--parch1),var(--parch2));border:3px solid var(--edge);border-radius:10px 10px 18px 18px;padding:5px 14px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.power b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:22px;color:#a12a10}
.log{font-size:13px;color:var(--ink);max-height:150px;overflow:auto;display:flex;flex-direction:column-reverse;font-weight:700}
.log div{padding:3px 0;border-bottom:1px dashed rgba(120,80,30,.35)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,10,4,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.mbox{max-width:580px;width:100%;max-height:88vh;overflow:auto;padding:18px;border:7px solid var(--wood2);border-radius:16px;
  background:radial-gradient(ellipse at 30% 10%,var(--parch1),var(--parch2) 75%,var(--parch3));box-shadow:0 0 0 3px var(--wood-hi),0 14px 40px rgba(0,0,0,.5)}
.mbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.big{display:flex;justify-content:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--wood2);color:#fff3d6;border:3px solid var(--wood-hi);padding:8px 16px;border-radius:999px;z-index:20;font-weight:800}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:520px){.card{width:108px;min-height:150px}.zone{padding-inline:10px}}
@media (prefers-reduced-motion:reduce){.card,button{transition:none}}
</style>
</head>

  ['treasure','Tek Kullanımlık','Patlayan Konfeti',3,'Bir canavara -3 güç (savaş sırasında). Kullanınca at.',2],
  ['treasure','Tek Kullanımlık','Uyku Tozu',0,'Bir canavarı savaştan çıkar. Kullanınca at.'],
  ['treasure','Seviye','Küçük Başarı',0,'Hemen 1 seviye atla.',2],
  ['treasure','Seviye','Büyük Başarı',0,'Hemen 1 seviye atla.']
];

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const otherOf = r => r === 'h' ? 'g' : 'h';

let peer = null, conn = null, role = null, state = null, view = null;
let myName = '', roomCode = '', online = false, leaving = false, statusMsg = '';

/* ---------- Oyun durumu (sadece oda sahibinde) ---------- */
function mkDeck(deck) {
  const out = [];
  STARTER.filter(c => c[0] === deck).forEach(c => {
    for (let i = 0; i < (c[5] || 1); i++) out.push({ id: uid(), deck: c[0], kind: c[1], name: c[2], value: c[3], text: c[4] });
  });
  return shuffle(out);
}
function freshState(hostName, guestName) {
  return {
    players: { h: { name: hostName, level: 1, hand: [], table: [] }, g: { name: guestName || 'Bekleniyor', level: 1, hand: [], table: [] } },
    door: mkDeck('door'), treasure: mkDeck('treasure'), doorDisc: [], treasureDisc: [],
    center: [], log: [], die: null, online: { h: true, g: false }
  };
}
function log(t) { state.log.push(t); if (state.log.length > 50) state.log.shift(); }
function draw(deckName) {
  const deck = state[deckName], disc = state[deckName + 'Disc'];
  if (!deck.length && disc.length) {
    state[deckName] = shuffle(disc.splice(0));
    log((deckName === 'door' ? 'Kapı' : 'Hazine') + ' destesi bitti, atılanlar karıştırıldı.');
  }
  return state[deckName].pop() || null;
}
function take(id, r) {
  const o = otherOf(r);
  const lists = [state.players[r].hand, state.players[r].table, state.center, state.players[o].table, state.doorDisc, state.treasureDisc];
  for (const l of lists) { const i = l.findIndex(c => c.id === id); if (i >= 0) return l.splice(i, 1)[0]; }
  return null;
}
function applyAct(r, a) {
  const me = state.players[r], op = state.players[otherOf(r)];
  switch (a.t) {
    case 'draw': {
      const c = draw(a.d); if (!c) { log('Deste boş.'); break; }
      me.hand.push(c); log(`${me.name} ${a.d === 'door' ? 'Kapı' : 'Hazine'} destesinden elini çekti.`); break;
    }
    case 'reveal': {
      const c = draw(a.d); if (!c) { log('Deste boş.'); break; }
      state.center.push(c); log(`${me.name} ${a.d === 'door' ? 'Kapıyı tekmeledi' : 'Hazine açtı'}: ${c.name}`); break;
    }
    case 'move': {
      const c = take(a.id, r); if (!c) break;
      if (a.to === 'hand') { me.hand.push(c); log(`${me.name} "${c.name}" kartını eline aldı.`); }
      else if (a.to === 'table') { me.table.push(c); log(`${me.name} masaya koydu: ${c.name}`); }
      else if (a.to === 'center') { state.center.push(c); log(`${me.name} ortaya koydu: ${c.name}`); }
      else if (a.to === 'give') { op.hand.push(c); log(`${me.name}, ${op.name}'e bir kart verdi.`); }
      else if (a.to === 'discard') { state[c.deck + 'Disc'].push(c); log(`${me.name} attı: ${c.name}`); }
      break;
    }
    case 'level': {
      const p = a.who === 'me' ? me : op;
      p.level = Math.max(1, p.level + a.d); log(`${p.name} seviyesi ${p.level} oldu.`); break;
    }
    case 'roll': {
      const v = 1 + Math.floor(Math.random() * 6);
      state.die = { by: me.name, val: v, n: (state.die ? state.die.n : 0) + 1 }; log(`${me.name} zar attı: ${v}`); break;
    }
    case 'clearCenter': {
      const n = state.center.length;
      state.center.splice(0).forEach(c => state[c.deck + 'Disc'].push(c));
      if (n) log(`${me.name} ortadaki kartları attı.`); break;
    }
    case 'deal': {
      ['h', 'g'].forEach(k => { for (let i = 0; i < 4; i++) { const d = draw('door'); if (d) state.players[k].hand.push(d); const t = draw('treasure'); if (t) state.players[k].hand.push(t); } });
      log('Kartlar dağıtıldı (4 Kapı + 4 Hazine).'); break;
    }
    case 'newgame': {
      const h = state.players.h.name, g = state.players.g.name, on = state.online;
      state = freshState(h, g); state.online = on; log('Yeni oyun başladı.'); break;
    }
    case 'addcard': {
      const c = { id: uid(), deck: a.deck, kind: a.kind || 'Kart', name: a.name, value: +a.value || 0, text: a.text || '' };
      state[a.deck].push(c); shuffle(state[a.deck]); log(`${me.name} desteye kart ekledi: ${c.name}`); break;
    }
    case 'shuffle': { shuffle(state[a.d]); log(`${me.name} ${a.d === 'door' ? 'Kapı' : 'Hazine'} destesini karıştırdı.`); break; }
  }
}
function viewFor(r) {
  const s = JSON.parse(JSON.stringify(state));
  const o = otherOf(r);
  s.players[o].hand = s.players[o].hand.map(() => null);
  s.doorN = s.door.length; s.treasureN = s.treasure.length;
  delete s.door; delete s.treasure;
  s.me = r;
  return s;
}

/* ---------- Ağ ---------- */
function sync() {
  if (role !== 'h') return;
  try { localStorage.setItem('mnk_host', JSON.stringify({ code: roomCode, name: myName, state })); } catch (e) {}
  view = viewFor('h');
  if (conn && conn.open) conn.send({ type: 'state', s: viewFor('g') });
  render();
}
function dispatch(a) {
  if (role === 'h') { applyAct('h', a); sync(); }
  else if (conn && conn.open) conn.send({ type: 'act', a });
}
function hostRoom(resume) {
  roomCode = resume ? resume.code : Math.random().toString(36).slice(2, 7).toUpperCase();
  role = 'h';
  state = resume ? resume.state : freshState(myName);
  state.players.h.name = myName; state.online = { h: true, g: false };
  peer = new Peer('mnk-' + roomCode);
  peer.on('open', () => { statusMsg = ''; if (!resume) log('Oda açıldı.'); sync(); });
  peer.on('connection', c => {
    if (conn && conn.open) { c.on('open', () => c.close()); return; }
    conn = c;
    c.on('open', () => { state.online.g = true; sync(); });
    c.on('data', m => {
      if (m.type === 'hello') { state.players.g.name = m.name || 'Misafir'; log(`${state.players.g.name} odaya katıldı.`); state.online.g = true; sync(); }
      else if (m.type === 'act') { applyAct('g', m.a); sync(); }
    });
    c.on('close', () => { state.online.g = false; sync(); });
  });
  peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
  peer.on('error', e => {
    if (e.type === 'unavailable-id') { peer.destroy(); hostRoom(null); }
    else { statusMsg = 'Bağlantı hatası: ' + e.type; render(); }
  });
  renderGame();
}
function joinRoom(code, name) {
  role = 'g'; roomCode = code.toUpperCase().trim(); myName = name; leaving = false;
  try { localStorage.setItem('mnk_guest', JSON.stringify({ code: roomCode, name })); } catch (e) {}
  connectGuest();
  renderGame();
}
function connectGuest() {
  if (peer) { try { peer.destroy(); } catch (e) {} }
  statusMsg = 'Bağlanılıyor...'; render();
  peer = new Peer();
  peer.on('open', () => {
    conn = peer.connect('mnk-' + roomCode, { reliable: true });
    conn.on('open', () => { statusMsg = ''; conn.send({ type: 'hello', name: myName }); });
    conn.on('data', m => { if (m.type === 'state') { view = m.s; render(); } });
    conn.on('close', () => { statusMsg = 'Bağlantı koptu, tekrar deneniyor...'; view = view; render(); retry(); });
  });
  peer.on('error', e => {
    if (e.type === 'peer-unavailable') { statusMsg = 'Oda bulunamadı. Kod doğru mu? Oda sahibi sayfayı açık tutuyor mu?'; render(); retry(8000); }
    else { statusMsg = 'Bağlantı hatası: ' + e.type; render(); retry(8000); }
  });
}
let retryT = null;
function retry(ms) { clearTimeout(retryT); if (leaving) return; retryT = setTimeout(() => { if (!leaving && role === 'g') connectGuest(); }, ms || 3000); }

/* ---------- Arayüz ---------- */
function renderLobby() {
  const q = new URLSearchParams(location.search).get('oda') || '';
  let savedName = '', hasHost = false;
  try { const g = JSON.parse(localStorage.getItem('mnk_guest') || 'null'); if (g) savedName = g.name; const h = JSON.parse(localStorage.getItem('mnk_host') || 'null'); if (h) { hasHost = true; savedName = savedName || h.name; } } catch (e) {}
  $('#app').innerHTML = `
  <div class="lobby">
    <div class="hero parch">
      <div class="emblem">⚔️</div>
      <h1>Zindan Masası</h1>
      <h2>Efsanevi macera başlıyor!</h2>
      <p>İki kişilik, uzaktan oynanan kart masası. Kurnaz ol, güçlü ol, diğerini geride bırak!</p>
    </div>
    <div class="heroname parch">
      <label for="nm" style="margin-top:0">Kahramanın adı</label>
      <input id="nm" maxlength="20" value="${esc(savedName)}" placeholder="Adını yaz">
    </div>
    <div class="modes">
      <div class="mode parch">
        <div class="ico">🏰</div><div class="title">Oda aç</div>
        <small>Bir oda kodu çıkar, linki arkadaşına gönder.</small>
        <div class="row"><button class="primary" data-a="host">Oluştur ▶</button>
        ${hasHost ? '<button data-a="resume">Devam et ▶</button>' : ''}</div>
      </div>
      <div class="mode parch">
        <div class="ico">🚪</div><div class="title">Odaya katıl</div>
        <input id="cd" maxlength="8" value="${esc(q)}" placeholder="Oda kodu (örn: K7P2Q)" style="text-transform:uppercase;text-align:center">
        <div class="row"><button class="primary" data-a="join" style="background:linear-gradient(#4a9bea,var(--blue2));box-shadow:0 4px 0 #0f3a6b,inset 0 1px 0 rgba(255,255,255,.35)">Katıl ▶</button></div>
      </div>
    </div>
    <div class="err" id="lerr"></div>
  </div>`;
}
function renderGame() { render(); }
function findCard(id) {
  if (!view) return null;
  const P = view.players;
  const lists = [[P[view.me].hand, 'hand'], [P[view.me].table, 'table'], [view.center, 'center'], [P[otherOf(view.me)].table, 'otherTable'], [view.doorDisc, 'discard'], [view.treasureDisc, 'discard']];
  for (const [l, loc] of lists) { const c = l.find(x => x && x.id === id); if (c) return { c, loc }; }
  return null;
}
function cardHTML(c) {
  if (!c) return '<div class="card back">Gizli kart</div>';
  const v = +c.value;
  const val = v ? `<div class="val">${v > 0 && c.kind !== 'Canavar' ? '+' : ''}${v}</div>` : '';
  return `<div class="card ${c.deck}" data-card="${c.id}" tabindex="0"><div class="kind">${esc(c.kind)}</div><div class="nm">${esc(c.name)}</div>${val}<div class="tx">${esc(c.text)}</div></div>`;
}
function cardsRow(list, emptyText) {
  return `<div class="cards">${list.length ? list.map(cardHTML).join('') : `<div class="empty">${emptyText}</div>`}</div>`;
}
function tableBonus(p) { return p.table.reduce((s, c) => s + (+c.value || 0), 0); }
function render() {
  if (!role) { renderLobby(); return; }
  if (!view) {
    $('#app').innerHTML = `<div class="lobby"><h1>Oda ${esc(roomCode)}</h1><p>${esc(statusMsg || 'Bağlanılıyor...')}</p><button data-a="leave">Geri dön</button></div>`;
    return;
  }
  const keep = { top: window.scrollY };
  const me = view.players[view.me], op = view.players[otherOf(view.me)];
  const opOnline = view.online[otherOf(view.me)];
  const monsters = view.center.filter(c => c.kind === 'Canavar');
  const mods = view.center.filter(c => c.kind !== 'Canavar');
  const mSum = monsters.reduce((s, c) => s + (+c.value || 0), 0), modSum = mods.reduce((s, c) => s + (+c.value || 0), 0);
  const myPow = me.level + tableBonus(me), opPow = op.level + tableBonus(op);
  const link = location.origin + location.pathname + '?oda=' + roomCode;
  const modal = document.getElementById('modalHost') ? document.getElementById('modalHost').innerHTML : '';
  $('#app').innerHTML = `
  <div class="wrap">
    <div class="top wood">
      <div class="logo">Zindan Masası</div>
      <div class="row">
        <span class="pill"><span class="dot ${opOnline ? 'on' : ''}"></span>${esc(op.name)}${opOnline ? '' : ' (çevrimdışı)'}</span>
        <span class="pill">Oda: <b>${esc(roomCode)}</b></span>
        <button class="small" data-a="copy" data-link="${esc(link)}">Linki kopyala</button>
      </div>
      <div class="row">
        ${view.die ? `<span class="pill">🎲 <b>${view.die.val}</b> (${esc(view.die.by)})</span>` : ''}
        <button data-a="roll">Zar at</button>
      </div>
    </div>
    ${statusMsg ? `<div class="banner">${esc(statusMsg)}</div>` : ''}
    ${!opOnline && role === 'h' ? '<div class="banner">Rakip bekleniyor. "Linki kopyala" ile bağlantıyı gönder. Sen bu sayfayı açık tut.</div>' : ''}

    <div class="zone">
      <div class="zhead">
        <div class="zname">${esc(op.name)}</div>
        <div class="stat">Seviye <button class="small" data-a="level" data-who="other" data-d="-1">−</button><span class="lvl">${op.level}</span><button class="small" data-a="level" data-who="other" data-d="1">+</button>
        <span class="pill">Güç ${opPow}</span><span class="pill">Elinde ${op.hand.length} kart</span></div>
      </div>
      <div class="sub">Masası</div>
      ${cardsRow(op.table, 'Masada kart yok')}
    </div>

    <div class="zone center">
      <div class="zhead"><div class="zname">Savaş alanı</div>
        <div class="row"><button class="small" data-a="clearCenter">Ortayı temizle</button></div></div>
      ${cardsRow(view.center, 'Kapıyı tekmele ya da ortaya kart koy')}
      <div class="power">
        <span>Canavar <b>${mSum}</b>${modSum ? ` (${modSum > 0 ? '+' : ''}${modSum} ek)` : ''} = <b>${mSum + modSum}</b></span>
        <span>${esc(me.name)} <b>${myPow}</b></span>
        <span>${esc(op.name)} <b>${opPow}</b></span>
      </div>
      <div class="decks">
        <div class="deck"><div class="title">Kapı destesi</div><div class="count">${view.doorN} kart</div>
          <button class="primary" data-a="reveal" data-d="door">Kapıyı tekmele</button>
          <button data-a="draw" data-d="door">Elime çek</button>
          <button class="small" data-a="discards" data-d="door">Atılanlar (${view.doorDisc.length})</button></div>
        <div class="deck"><div class="title">Hazine destesi</div><div class="count">${view.treasureN} kart</div>
          <button class="primary" data-a="reveal" data-d="treasure">Hazine aç</button>
          <button data-a="draw" data-d="treasure">Elime çek</button>
          <button class="small" data-a="discards" data-d="treasure">Atılanlar (${view.treasureDisc.length})</button></div>
        <div class="deck"><div class="title">Masa</div>
          <button data-a="deal">Dağıt (4+4)</button>
          <button class="small" data-a="addform">Kart ekle</button>
          <button class="small" data-a="newgame">Yeni oyun</button></div>
      </div>
    </div>

    <div class="zone">
      <div class="zhead">
        <div class="zname">${esc(me.name)} (sen)</div>
        <div class="stat">Seviye <button class="small" data-a="level" data-who="me" data-d="-1">−</button><span class="lvl">${me.level}</span><button class="small" data-a="level" data-who="me" data-d="1">+</button>
        <span class="pill">Güç ${myPow}</span></div>
      </div>
      <div class="sub">Masan</div>
      ${cardsRow(me.table, 'Masanda kart yok')}
      <div class="sub">Elin (rakip görmez)</div>
      ${cardsRow(me.hand, 'Elin boş')}
    </div>

    <div class="zone"><div class="zname" style="margin-bottom:6px">Olaylar</div>
      <div class="log">${view.log.map(l => `<div>${esc(l)}</div>`).join('')}</div></div>
    <button class="small" data-a="leave">Odadan çık</button>
  </div>
  <div id="modalHost">${modal}</div>`;
  window.scrollTo(0, keep.top);
}

/* ---------- Pencereler ---------- */
function openModal(html) { document.getElementById('modalHost').innerHTML = `<div class="modal" data-a="closeBg"><div class="mbox">${html}</div></div>`; }
function closeModal() { const m = document.getElementById('modalHost'); if (m) m.innerHTML = ''; }
function cardModal(id) {
  const f = findCard(id); if (!f) return;
  const { c, loc } = f;
  const B = (label, to, cls) => `<button ${cls ? `class="${cls}"` : ''} data-a="move" data-id="${c.id}" data-to="${to}">${label}</button>`;
  let btns = '';
  if (loc === 'hand') btns = B('Masaya koy', 'table', 'primary') + B('Ortaya koy', 'center') + B('Rakibe ver', 'give') + B('At', 'discard');
  else if (loc === 'table') btns = B('Ele al', 'hand') + B('Ortaya koy', 'center') + B('Rakibe ver', 'give') + B('At', 'discard');
  else if (loc === 'center') btns = B('Ele al', 'hand', 'primary') + B('Masaya koy', 'table') + B('At', 'discard');
  else if (loc === 'otherTable') btns = B('Bana al', 'hand') + B('At', 'discard');
  else if (loc === 'discard') btns = B('Ele al', 'hand', 'primary') + B('Ortaya koy', 'center');
  openModal(`<div class="big">${cardHTML(c).replace('data-card', 'data-x')}</div><div class="mbtns">${btns}<button data-a="closeModal">Kapat</button></div>`);
}
function discardModal(d) {
  const list = d === 'door' ? view.doorDisc : view.treasureDisc;
  openModal(`<b>${d === 'door' ? 'Kapı' : 'Hazine'} atılanlar</b><div class="cards" style="margin-top:10px">${list.length ? list.map(cardHTML).join('') : '<div class="empty">Boş</div>'}</div><div class="mbtns"><button data-a="shuf" data-d="${d}">Desteyi karıştır</button><button data-a="closeModal">Kapat</button></div>`);
}
function addForm() {
  openModal(`<b>Desteye kart ekle</b>
  <label>Deste</label><select id="af-deck"><option value="door">Kapı</option><option value="treasure">Hazine</option></select>
  <label>Tür (Canavar, Lanet, Eşya...)</label><input id="af-kind" value="Canavar">
  <label>İsim</label><input id="af-name" maxlength="40">
  <label>Değer (canavar seviyesi veya eşya bonusu)</label><input id="af-val" type="number" value="0">
  <label>Açıklama</label><textarea id="af-text" rows="3" maxlength="160"></textarea>
  <div class="mbtns"><button class="primary" data-a="addcard">Ekle</button><button data-a="closeModal">Kapat</button></div>`);
}
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }

/* ---------- Olaylar ---------- */
document.addEventListener('click', e => {
  const cardEl = e.target.closest('[data-card]');
  const btn = e.target.closest('[data-a]');
  if (btn && btn.dataset.a === 'closeBg') { if (e.target === btn) closeModal(); return; }
  if (btn && !btn.classList.contains('modal')) {
    const a = btn.dataset.a, d = btn.dataset;
    switch (a) {
      case 'host': case 'resume': {
        const nm = $('#nm').value.trim(); if (!nm) { $('#lerr').textContent = 'Önce adını yaz.'; return; }
        myName = nm; leaving = false;
        let res = null;
        if (a === 'resume') { try { res = JSON.parse(localStorage.getItem('mnk_host')); } catch (x) {} }
        hostRoom(res); return;
      }
      case 'join': {
        const nm = $('#nm').value.trim(), cd = $('#cd').value.trim();
        if (!nm) { $('#lerr').textContent = 'Önce adını yaz.'; return; }
        if (!cd) { $('#lerr').textContent = 'Oda kodunu yaz.'; return; }
        joinRoom(cd, nm); return;
      }
      case 'leave': {
        if (!confirm('Odadan çıkılsın mı?')) return;
        leaving = true; clearTimeout(retryT);
        if (conn) try { conn.close(); } catch (x) {}
        if (peer) try { peer.destroy(); } catch (x) {}
        peer = conn = null; role = null; view = null; state = null; statusMsg = '';
        history.replaceState(null, '', location.pathname); render(); return;
      }
      case 'copy': { navigator.clipboard.writeText(d.link).then(() => toast('Link kopyalandı'), () => prompt('Linki kopyala:', d.link)); return; }
      case 'closeModal': closeModal(); return;
      case 'roll': dispatch({ t: 'roll' }); return;
      case 'draw': dispatch({ t: 'draw', d: d.d }); return;
      case 'reveal': dispatch({ t: 'reveal', d: d.d }); return;
      case 'level': dispatch({ t: 'level', who: d.who, d: +d.d }); return;
      case 'clearCenter': dispatch({ t: 'clearCenter' }); return;
      case 'deal': if (confirm('Her iki oyuncuya 4 Kapı + 4 Hazine dağıtılsın mı?')) dispatch({ t: 'deal' }); return;
      case 'newgame': if (confirm('Her şey sıfırlansın ve yeni oyun başlasın mı?')) dispatch({ t: 'newgame' }); return;
      case 'discards': discardModal(d.d); return;
      case 'shuf': dispatch({ t: 'shuffle', d: d.d }); closeModal(); return;
      case 'addform': addForm(); return;
      case 'addcard': {
        const name = $('#af-name').value.trim(); if (!name) { toast('Kart ismi yaz'); return; }
        dispatch({ t: 'addcard', deck: $('#af-deck').value, kind: $('#af-kind').value.trim(), name, value: $('#af-val').value, text: $('#af-text').value.trim() });
        closeModal(); return;
      }
      case 'move': dispatch({ t: 'move', id: d.id, to: d.to }); closeModal(); return;
    }
  }
  if (cardEl) cardModal(cardEl.dataset.card);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.card) cardModal(e.target.dataset.card);
});
render();
</script>
</body>
</html>
